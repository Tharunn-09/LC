name: LeetCode Daily Streak & Multi-Problem Bot

# Triggered via external scheduler (cron-job.org) using workflow_dispatch API
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Problem Solving Mode'
        required: true
        default: 'potd'
        type: choice
        options:
          - potd
          - extra
          - batch
      extra_index:
        description: 'Extra problem index (1-5, optional)'
        required: false
        default: ''
        type: string
      difficulty:
        description: 'Difficulty filter'
        required: false
        default: 'RANDOM'
        type: choice
        options:
          - RANDOM
          - EASY
          - MEDIUM
          - HARD
      problem_url:
        description: 'Problem URL or Slug (optional, e.g. https://leetcode.com/problems/two-sum/ or two-sum)'
        required: false
        default: ''
        type: string
      problem_count:
        description: 'Problem count for batch mode'
        required: false
        default: '5'
        type: string

env:
  TZ: "Asia/Kolkata"

concurrency:
  group: leetcode-streak-workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  solve-leetcode:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Run Mode & Parameters
        id: params
        shell: bash
        run: |
          CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S %Z')
          echo "Triggered Run at: $CURRENT_TIME"
          
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE="potd"
          fi

          DIFFICULTY="${{ github.event.inputs.difficulty }}"
          if [ -z "$DIFFICULTY" ]; then
            DIFFICULTY="RANDOM"
          fi

          echo "Execution Mode: $MODE (Difficulty: $DIFFICULTY)"
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "difficulty=$DIFFICULTY" >> $GITHUB_OUTPUT
          echo "extra_index=${{ github.event.inputs.extra_index }}" >> $GITHUB_OUTPUT
          echo "problem_count=${{ github.event.inputs.problem_count || '1' }}" >> $GITHUB_OUTPUT
          echo "problem_url=${{ github.event.inputs.problem_url }}" >> $GITHUB_OUTPUT

      - name: Run LeetCode Solver
        env:
          TZ: "Asia/Kolkata"
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.6-flash"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "qwen/qwen3.8-27b"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: "LeetCode Bot <onboarding@resend.dev>"
          PROGRAMMING_LANGUAGE: "python3"
        run: |
          EXTRA_FLAG=""
          if [ -n "${{ steps.params.outputs.extra_index }}" ]; then
            EXTRA_FLAG="--extra-index ${{ steps.params.outputs.extra_index }}"
          fi
          
          URL_FLAG=""
          if [ -n "${{ steps.params.outputs.problem_url }}" ]; then
            URL_FLAG="--url '${{ steps.params.outputs.problem_url }}'"
          fi

          python main.py \
            --mode ${{ steps.params.outputs.mode }} \
            --difficulty ${{ steps.params.outputs.difficulty }} \
            --count ${{ steps.params.outputs.problem_count }} \
            $EXTRA_FLAG \
            $URL_FLAG

      - name: Persist Solved History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "solved_history.json" ]; then
            git add solved_history.json
            if ! git diff --staged --quiet; then
              git commit -m "Update solved_history.json [skip ci]"
              for attempt in 1 2 3; do
                echo "Attempt $attempt: Pulling latest changes and pushing history..."
                git pull --rebase origin main || true
                if git push origin HEAD:main; then
                  echo "Successfully pushed updated solved_history.json."
                  break
                fi
                sleep 5
              done
            fi
          fi
